name: Readmint
on:
  push:
    branches: [main]
    paths:
      - "*/designs/**"
      - ".github/workflows/readmint.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readmint
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render year-ring
        uses: MrLarkyy/Readmint@v0.5.0
        with:
          output-dir: year-ring/readmint
          props-file: year-ring/designs/settings.json
          commit-message: "Update year-ring graphics"
          manifest: year-ring/designs/renders.json
      - name: Render horizon
        uses: MrLarkyy/Readmint@v0.5.0
        with:
          output-dir: horizon/readmint
          props-file: horizon/designs/settings.json
          commit-message: "Update horizon graphics"
          manifest: horizon/designs/renders.json
      - name: Render pinscreen
        uses: MrLarkyy/Readmint@v0.5.0
        with:
          output-dir: pinscreen/readmint
          props-file: pinscreen/designs/settings.json
          commit-message: "Update pinscreen graphics"
          manifest: pinscreen/designs/renders.json
